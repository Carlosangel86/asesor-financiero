# =====================================================================
# Flujo de CI/CD para Despliegue Automatizado en Firebase Hosting
# Proyecto: asesor-financiero-83679
# Repositorio: https://github.com/Carlosangel86/asesor-financiero
# =====================================================================

name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASESOR_FINANCIERO_83679 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_CFO_COPILOT_FINANZAS || secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_CREDENTIALS || vars.FIREBASE_SERVICE_ACCOUNT_ASESOR_FINANCIERO_83679 || vars.FIREBASE_SERVICE_ACCOUNT || vars.FIREBASE_SERVICE_ACCOUNT_CFO_COPILOT_FINANZAS }}

      - name: Deploy to Firebase Hosting
        id: deploy
        run: |
          set +e
          echo "Iniciando despliegue Firebase..."
          npx --yes firebase-tools deploy --only hosting --project asesor-financiero-83679 --debug > deploy.log 2>&1
          STATUS=$?
          
          # Extraer el error especifico
          ERR_LINE=$(grep -i "error:" deploy.log | tail -n 5 | tr '\n' ' -- ')
          echo "::error title=Firebase CLI Result::Exit Code $STATUS | $ERR_LINE"
          
          # Guardar log en rama debug para inspeccion completa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-deploy-log
          git add deploy.log
          git commit -m "chore(debug): log de despliegue [skip ci]" || true
          git push origin debug-deploy-log --force || true
          
          cat deploy.log
          exit $STATUS
